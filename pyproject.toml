[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glean"
version = "0.1.0"
description = "CLI/TUI reference manager with a plain-text source of truth and a citation-graph layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Osamu Miyawaki", email = "user@example.com" }]

dependencies = [
    "ruamel.yaml>=0.18",
    "textual>=0.50",
    "httpx>=0.27",
    "networkx>=3.0",
    "pyvis>=0.3",
    "pybtex>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
glean = "glean.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["glean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
